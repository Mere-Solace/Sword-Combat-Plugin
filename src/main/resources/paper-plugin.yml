name: Sword
version: '${version}'
main: btm.sword.Sword
api-version: '1.21.8'
loader: btm.sword.SwordPluginLoader

dependencies:
  server:
    ProtocolLib:
      load: BEFORE
      required: true
    DisplayEntityUtils:
      load: BEFORE
      required: true

permissions:
  sword.use:
    description: Allows use of /sword command
    default: true
  sword.reload:
    description: Allows reloading configuration
    default: op
  sword.dev:
    description: Allows use of /sword dev subcommands (data toggles, fresh profile)
    default: op
